name: Build PhotoCraft APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust & WASM
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli

      # إجبار تفعيل ميزة js في مكتبة uuid لبناء الـ wasm
      - name: Build Web / WASM Bundle
        env:
          RUSTFLAGS: "-A warnings --cfg getrandom_backend=\"wasm_js\""
        run: |
          cargo add uuid --features "js" -p photocraft || true
          cargo build --release --target wasm32-unknown-unknown -p photocraft
          mkdir -p www
          wasm-bindgen --target web --out-dir www target/wasm32-unknown-unknown/release/photocraft.wasm
          
          # إنشاء ملف index.html
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
              <title>PhotoCraft</title>
              <style>
                  html, body, canvas {
                      margin: 0px;
                      padding: 0px;
                      width: 100%;
                      height: 100%;
                      overflow: hidden;
                      background-color: #1e1e1e;
                  }
              </style>
          </head>
          <body>
              <canvas id="the_canvas_id"></canvas>
              <script type="module">
                  import init from './photocraft.js';
                  init();
              </script>
          </body>
          </html>
          EOF

      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "PhotoCraft" "com.craft.photocraft" --web-dir "www"
          npx cap add android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
