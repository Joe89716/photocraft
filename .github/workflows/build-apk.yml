name: Build PhotoCraft APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust & WASM
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      # استخدام أمر البناء الرسمي للمشروع مع تعطيل إيقاف البناء عند التحذيرات
      - name: Build Web Bundle
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          cargo xtask web --release

      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # نحدد مجلد المخرجات الذي ينتجه xtask (غالباً dist أو target/web)
          TARGET_DIR="dist"
          if [ -d "target/web" ]; then TARGET_DIR="target/web"; fi
          npx cap init "PhotoCraft" "com.craft.photocraft" --web-dir "$TARGET_DIR"
          npx cap add android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
