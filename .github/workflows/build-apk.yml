name: Build PhotoCraft APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust & WASM
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli

      # بناء حزمة الواجهة الرسومية واستهداف wasm مباشرة بدون فحص التحذيرات
      - name: Build Web / WASM Bundle
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          cargo build --release --target wasm32-unknown-unknown -p photocraft
          mkdir -p www
          wasm-bindgen --target web --out-dir www target/wasm32-unknown-unknown/release/photocraft.wasm
          if [ -f apps/photocraft/index.html ]; then cp apps/photocraft/index.html www/; elif [ -f index.html ]; then cp index.html www/; fi

      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "PhotoCraft" "com.craft.photocraft" --web-dir "www"
          npx cap add android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
